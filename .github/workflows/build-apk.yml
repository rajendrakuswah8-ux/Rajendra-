name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify Gradle and Android Project
        run: |
          echo "=== Verifying Android Project ==="
          java -version
          gradle -v
          ls -la app/
          if [ ! -f "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Verify APK generated
        id: verify-apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected debug APK not found or empty at $APK_PATH"
            find app/build -name "*.apk" || true
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "APK generated successfully: $APK_PATH ($FILE_SIZE bytes)"
          echo "apk_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        id: create-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          RELEASE_TITLE="Guardian Parental Control APK - Build #${{ github.run_number }}"
          ASSET_NAME="Guardian-ParentalControl-debug-${{ github.run_number }}.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "./${ASSET_NAME}"
          gh release create "$TAG_NAME" \
            "./${ASSET_NAME}#${ASSET_NAME}" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Android Build #${{ github.run_number }} for Guardian Parental Control. Production native Android APK compiled and ready to install." \
            --latest
          echo "release_tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Print Download Information
        if: always()
        run: |
          echo "### 📱 Android Native Guardian APK Build Complete!" >> "$GITHUB_STEP_SUMMARY"
          echo "Download your verified APK from GitHub Releases or from Artifacts named **guardian-debug-apk**." >> "$GITHUB_STEP_SUMMARY"
